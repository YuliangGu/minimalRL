[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minimalrl"
version = "0.1.0"
description = "Minimal, batteries-included reinforcement learning examples in PyTorch."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "MinimalRL Maintainers", email = "maintainers@example.com" }
]
dependencies = [
  "torch>=2.1",
  "gymnasium>=0.29",
  "numpy>=1.24"
]
keywords = ["reinforcement learning", "pytorch", "gymnasium"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.optional-dependencies]
wandb = [
  "wandb>=0.15"
]
envpool = [
  "envpool>=0.8.3",
  "cloudpickle>=2.2"
]
dev = [
  "pytest>=7.4",
  "pytest-xdist>=3.3",
  "ruff>=0.4",
  "black>=24.4",
  "mypy>=1.8"
]

[tool.setuptools.packages.find]
include = ["minimalrl", "minimalrl.*"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B", "UP", "N", "SIM", "PL"]
ignore = ["E203", "E266", "E501"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["minimalrl/tests"]

